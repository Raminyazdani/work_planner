<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ورود خصوصی · Work Planner</title><link rel="stylesheet" href="/style.css"><link rel="icon" type="image/svg+xml" href="/favicon.svg"></head>
<body class="login-page">
  <main class="login-card">
    <div class="login-brand" dir="ltr"><span class="brand-icon">◫</span><strong>WORK PLANNER</strong></div>
    <p class="eyebrow">فضای کاری شخصی</p>
    <h1>برنامهٔ کار، فقط برای تو</h1>
    <p class="login-intro">برای دیدن ساعت‌ها، تقویم و خروجی‌ها، کلید دسترسی این برنامه را وارد کن.</p>
    <form id="login-form">
      <label for="access-key">کلید دسترسی</label>
      <input id="access-key" name="accessKey" type="password" autocomplete="current-password" required autofocus maxlength="512" dir="ltr" spellcheck="false">
      <button id="login-submit" class="primary" type="submit">ورود به برنامه</button>
      <p id="login-message" class="login-message" role="status" aria-live="polite"></p>
    </form>
    <p class="login-footnote">کلید دسترسی در حافظهٔ مرورگر ذخیره نمی‌شود. پس از پایان کار روی دستگاه مشترک، از برنامه خارج شو.</p>
  </main>
  <script type="module" src="/login.mjs"></script>
</body>
</html>
